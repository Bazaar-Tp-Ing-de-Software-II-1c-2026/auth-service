services:
  db-auth:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user_auth
      - POSTGRES_PASSWORD=pass_auth
      - POSTGRES_DB=auth_db
    ports:
      - "5433:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_auth -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user_auth:pass_auth@db-auth:5432/auth_db
      - EMAIL_FROM=contacto@bazaar-app.me
      - AWS_REGION=us-east-2
      - S3_BUCKET_NAME=bazaar-server-imagenes
      - RESEND_API_KEY=re_Jqw3fevg_JcEpxRyH3U6oNEQknYdtnF2b
    depends_on:
      db-auth:
        condition: service_healthy